<html>
<head>
  <meta charset="utf-8">
  <title>Sixcode</title>
  <style>
    body {
      margin: 0;
    }
    pre.error {
      margin: 40px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script type="text/javascript">
    var Module = {
        preRun: [],
        postRun: [],
        print: (text) => console.log(text),
        printErr: (text) => console.error(text),
        canvas: document.getElementById('canvas'),
    };

    var isCoreInitialized = false;

    function core_initialized() {
        isCoreInitialized = true;
    }

    function displayError(error) {
        document.body.innerHTML = '<pre class="error">' + error + '</pre>';
    }
  </script>
  <script async type="text/javascript" src="core.js"></script>
  <script async type="text/javascript" src="ui.js"></script>
</body>
</html>
