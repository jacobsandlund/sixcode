user nginx;

# Set number of worker processes automatically based on number of CPU cores.
worker_processes auto;

# Enables the use of JIT for regular expressions to speed-up their processing.
pcre_jit on;

# Configures default error logger.
error_log /var/log/nginx/error.log warn;

events {
    # The maximum number of simultaneous connections that can be opened by
    # a worker process.
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Don't tell nginx version to clients.
    server_tokens off;

    # Specifies the maximum accepted body size of a client request, as
    # indicated by the request header Content-Length. If the stated content
    # length is greater than this size, then the client receives the HTTP
    # error code 413. Set to 0 to disable.
    client_max_body_size 200m;

    # Sendfile copies data between one FD and other from within the kernel,
    # which is more efficient than read() + write().
    sendfile on;

    # Timeout for keep-alive connections. Server will close connections after
    # this time.
    keepalive_timeout 65;

    # Don't buffer data-sends (disable Nagle algorithm).
    # Good for sending frequent small bursts of data in real time.
    tcp_nodelay on;

    # Path of the file with Diffie-Hellman parameters for EDH ciphers.
    #ssl_dhparam /etc/ssl/nginx/dh2048.pem;

    # Specifies that our cipher suits should be preferred over client ciphers.
    ssl_prefer_server_ciphers on;

    # Enables a shared SSL cache with size that can hold around 8000 sessions.
    ssl_session_cache shared:SSL:2m;


    # Enable gzipping of responses.
    #gzip on;

    # Set the Vary HTTP header as defined in the RFC 2616.
    gzip_vary on;

    # Enable checking the existence of precompressed files.
    #gzip_static on;


    # Specifies the main log format.
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"';

    # Specifies the postdata log format.
    log_format postdata '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for"\n'
        '$request_body';

    # Sets the path, format, and configuration for a buffered log write.
    access_log /var/log/nginx/access.log main;


    server {
        listen 8080;
        server_name localhost;

        root /sixcode/web;

        index index.html index.htm;

        location / {
            try_files /$uri /$uri/index.html /$uri.html =404;
        }

        location /github/ {
            proxy_pass https://github.com/;
        }

        location /github-oauth/ {
            proxy_pass https://github.com/;
            proxy_set_body $request_body&client_secret=INSERT_CLIENT_SECRET_HERE;
        }

        location ~ /local-git(/.*) {
            client_max_body_size 0;
            access_log /var/log/nginx/access.log postdata;
            fastcgi_param SCRIPT_FILENAME /usr/libexec/git-core/git-http-backend;
            include /etc/nginx/fastcgi_params;
            fastcgi_param GIT_HTTP_EXPORT_ALL "true";
            fastcgi_param GIT_PROJECT_ROOT /sixcode/development/git-repos/;
            fastcgi_param PATH_INFO $1;

            fastcgi_param REMOTE_USER $remote_user;
            fastcgi_pass unix:/run/ngnix/fcgiwrap.sock;
        }
    }
}
